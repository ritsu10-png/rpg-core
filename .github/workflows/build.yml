name: Build rpg_core

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract rpg_core
        run: |
          mkdir -p project
          unzip -q rpg_core.zip -d project
          echo "Project contents:"
          find project -maxdepth 2 -type f | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        working-directory: project
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: rpg_core-jar
          path: project/build/libs/*.jar
          if-no-files-found: error
